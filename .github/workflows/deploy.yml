name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Project
        run: npm run build
        working-directory: frontend
        env:
          BASE_URL: /revo1/
          NODE_ENV: production
          VITE_API_URL: https://reservobd.onrender.com
          VITE_FIREBASE_API_KEY: AIzaSyDl8_aAH-EoL7mOnLpHQYE0maIW8lpW4LI
          VITE_FIREBASE_AUTH_DOMAIN: reservo-de8ec.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: reservo-de8ec
          VITE_FIREBASE_STORAGE_BUCKET: reservo-de8ec.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "452998198059"
          VITE_FIREBASE_APP_ID: 1:452998198059:web:116c7ed562568d2dbb0b6e

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
