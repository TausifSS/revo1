spring.application.name=reservo-backend
server.port=${PORT:8080}


# ============================================================
# JWT CONFIGURATION
# ============================================================

app.jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tausifss.github.io,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://192.168.31.170:5174,http://192.168.31.170:5173,https://four-coins-occur.loca.lt}

app.frontend.url=${FRONTEND_URL:https://tausifss.github.io/revo1}


# ============================================================
# OTP
# ============================================================

app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}


# ============================================================
# FIREBASE
# ============================================================

firebase.service.account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}


# ============================================================
# TESTING MODE
# ============================================================

app.testing.mode=${TESTING_MODE:false}


# ============================================================
# OAUTH2
# ============================================================

spring.security.oauth2.client.enabled=true


# ============================================================
# GOOGLE
# ============================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:setup-google-client-id-in-env}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:setup-google-client-secret-in-env}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


# ============================================================
# FACEBOOK
# ============================================================

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:setup-facebook-client-id-in-env}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:setup-facebook-client-secret-in-env}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile


# ============================================================
# TWITTER / X
# ============================================================

spring.security.oauth2.client.registration.twitter.client-id=${TWITTER_CLIENT_ID:setup-twitter-client-id-in-env}
spring.security.oauth2.client.registration.twitter.client-secret=${TWITTER_CLIENT_SECRET:setup-twitter-client-secret-in-env}
spring.security.oauth2.client.registration.twitter.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.twitter.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.twitter.scope=users.read,tweet.read

spring.security.oauth2.client.provider.twitter.authorization-uri=https://twitter.com/i/oauth2/authorize
spring.security.oauth2.client.provider.twitter.token-uri=https://api.twitter.com/2/oauth2/token
spring.security.oauth2.client.provider.twitter.user-info-uri=https://api.twitter.com/2/users/me
spring.security.oauth2.client.provider.twitter.user-name-attribute=id


# ============================================================
# EMAIL / SMTP
# ============================================================

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ============================================================
# STRIPE
# ============================================================

app.stripe.api-key=${STRIPE_API_KEY:sk_test_51PxSampleKey}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_SampleSecret}


# ============================================================
# DATABASE SEEDING
# ============================================================

app.database.seed.enabled=true


# ============================================================
# MEDIA STORAGE
# ============================================================

app.media.storage-dir=${MEDIA_STORAGE_DIR:uploads/media}


# ============================================================
# FILE UPLOAD LIMITS
# ============================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB